# mobile.cfg.template — avec placeholders
# KI : "ki comp128 XX XX XX ... XX"  16 octets, octet 15=ms_idx, 16=op_id
#
# AUDIO [2026-09-22] : comme le run sans --dsp (/root/.osmocom/bb/mobile.cfg)
# sauf le format de trame TCH, plus la voie donnees.
#   tch-voice  io-handler gapk, io-tch-format ti (le DSP vocode ; c'est
#              « rtp » sans --dsp, ou c'est pont.py qui code), ALSA
#              gsm_out/gsm_in.
#   tch-data   io-handler unix-sock, /tmp/ms_data (CSD 9600 async, 8N1).
#   L'ordre tch-voice puis tch-data est celui que le mobile lui-meme ecrit.
#   `io-tch-format` n'est valide que derriere gapk ou unix-sock : sous l1phy le
#   mobile la refuse (« This parameter is only valid for GAPK ») et abandonne
#   tout le fichier.
#
# SOCKETS : les memes que le run sans --dsp (/tmp/osmocom_l2, /tmp/osmocom_sap)
# et non plus les variantes « _pont ». En montage DSP le module `l2` du fork
# n'est pas joue, donc aucun autre mobile ne les prend. Lancer a la main un
# banc grgsm ET ce banc-ci en meme temps les ferait se disputer : c'est le
# compromis assume pour n'avoir qu'un seul jeu de noms.
!
line vty
 no login
 bind 127.0.0.1 4347
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
!
log stderr
 logging filter all 1
 logging color 1
 logging timestamp 1
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
log gsmtap 172.20.0.1
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
ms 1
 layer2-socket /tmp/osmocom_l2
 sap-socket /tmp/osmocom_sap
 sim test
 network-selection-mode auto
 imei 358925008967594 0
 imei-fixed
 no emergency-imsi
 sms-service-center +3366612340001
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick 514
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  no p-gsm
  no e-gsm
  no r-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi 001010001000001
  ki comp128 00 11 22 33 44 55 66 77 88 99 aa bb cc dd 01 01
  no barred-access
  rplmn 001 01
 tch-voice
  io-handler gapk
! [2026-09-22] FORMAT DE TRAME TCH : « ti » ICI, « rtp » SANS --dsp.
! Ce n'est pas une preference, c'est QUI fait le vocodage. Sur ce banc-ci le
! vrai DSP tourne (c54x_exe, mask-ROM TI) et rend ses trames dans SA
! disposition, celle des telephones Calypso : « ti ».
! Le montage gr-gsm, lui, n'a pas de DSP — c'est pont.py qui code avec
! libosmocoding (gsm0503_tch_fr_encode/decode), laquelle parle RTP/RFC3551,
! 33 octets ouverts par la signature 0xD. D'ou le « rtp » de
! /root/.osmocom/bb/mobile.cfg et sa note du 2026-08-27 : elle vaut pour CE
! montage-la, pas pour celui-ci. Se tromper de cote ne leve aucun compteur,
! les trames passent — elles sont simplement lues avec le mauvais plan, et le
! son sort robotise.
  io-tch-format ti
  alsa-output-dev gsm_out
  alsa-input-dev gsm_in
 tch-data
  io-handler unix-sock
  io-tch-format ti
  unix-socket /tmp/ms_data
  call-params type-rate 71
  call-params ce transparent
  call-params async
  call-params async nr-stop-bits 1
  call-params async nr-data-bits 8
  call-params async parity none
 no shutdown
!
! GSMTAP configuration
!
gsmtap
 remote-host 172.20.0.1
 no local-host
 lchan sacch
 lchan lsacch
 lchan sacch/4
 lchan sacch/8
 lchan sacch/f
 lchan sacch/h
 lchan unknown
 lchan bcch
 lchan ccch
 lchan rach
 lchan agch
 lchan pch
 lchan sdcch
 lchan sdcch/4
 lchan sdcch/8
 lchan facch/f
 lchan facch/h
 lchan pacch
 lchan cbch
 lchan pdch
 lchan pttch
 lchan tch/f
 lchan tch/h
 category gprs dl-unknown
 category gprs dl-dummy
 category gprs dl-ctrl
 category gprs dl-data-gprs
 category gprs dl-data-egprs
 category gprs ul-unknown
 category gprs ul-dummy
 category gprs ul-ctrl
 category gprs ul-data-gprs
 category gprs ul-data-egprs
end

