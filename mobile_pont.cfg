# mobile.cfg.template - with placeholders
# KI: "ki comp128 XX XX XX ... XX"  16 bytes, byte 15=ms_idx, 16=op_id
#
# AUDIO: same as the run without --dsp (/root/.osmocom/bb/mobile.cfg) except
# the TCH frame format, plus the data channel.
#   tch-voice  io-handler gapk, io-tch-format ti (the DSP vocodes; it is
#              "rtp" without --dsp, where pont.py does the coding), ALSA
#              gsm_out/gsm_in.
#   tch-data   io-handler unix-sock, /tmp/ms_data (CSD 9600 async, 8N1).
#   The order tch-voice then tch-data is the one the mobile itself writes.
#   `io-tch-format` is only valid behind gapk or unix-sock: under l1phy the
#   mobile rejects it ("This parameter is only valid for GAPK") and discards
#   the whole file.
#
# SOCKETS: the same as the run without --dsp (/tmp/osmocom_l2, /tmp/osmocom_sap),
# not the "_pont" variants. In the DSP setup the fork's `l2` module is not
# run, so no other mobile takes them. Running a grgsm bench AND this bench by
# hand at the same time would make them fight over the sockets: this is the
# accepted trade-off for having a single set of names.
!
line vty
 no login
 bind 127.0.0.1 4247
!
gps device /dev/ttyACM0
gps baudrate default
no gps enable
!
no hide-default
!
!
log stderr
 logging filter all 1
 logging color 1
 logging timestamp 1
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
log gsmtap 172.20.0.1
 logging filter all 1
 logging color 0
 logging timestamp 0
 logging print category 1
 logging level mm debug
 logging level rr debug
 logging level cc debug
 logging level sms debug
!
ms 1
 layer2-socket /tmp/osmocom_l2
 sap-socket /tmp/osmocom_sap
 sim test
 network-selection-mode auto
 imei 358925008967594 0
 imei-fixed
 no emergency-imsi
 sms-service-center +3366612340001
 no call-waiting
 no auto-answer
 no force-rekey
 no clip
 no clir
 tx-power auto
 no simulated-delay
 stick 1
 location-updating
 neighbour-measurement
 codec full-speed prefer
 codec half-speed
 no abbrev
 support
  sms
  a5/1
  a5/2
  p-gsm
  e-gsm
  no r-gsm
  no gsm-850
  dcs
  no pcs
  class-900 4
  class-850 4
  class-dcs 1
  class-pcs 1
  channel-capability sdcch+tchf+tchh
  full-speech-v1
  full-speech-v2
  half-speech-v1
  min-rxlev -106
  dsc-max 90
  no skip-max-per-band
 test-sim
  imsi 001010001000001
  ki comp128 00 11 22 33 44 55 66 77 88 99 aa bb cc dd 01 01
  no barred-access
  rplmn 001 01
 tch-voice
  io-handler gapk
! TCH FRAME FORMAT: "ti" HERE, "rtp" WITHOUT --dsp.
! This is not a preference, it is WHO does the vocoding. On this bench the
! real DSP runs (c54x_exe, TI mask ROM) and returns its frames in ITS own
! layout, the one of Calypso phones: "ti".
! The gr-gsm setup has no DSP: pont.py does the coding with libosmocoding
! (gsm0503_tch_fr_encode/decode), which speaks RTP/RFC3551, 33 bytes opened
! by the 0xD signature; hence the "rtp" of /root/.osmocom/bb/mobile.cfg,
! which applies to THAT setup, not to this one. Picking the wrong side raises
! no counter, the frames go through: they are simply read with the wrong
! layout, and the audio comes out robotic.
  io-tch-format ti
  alsa-output-dev gsm_out
  alsa-input-dev gsm_in
 tch-data
  io-handler unix-sock
  io-tch-format ti
  unix-socket /tmp/ms_data
  call-params type-rate 71
  call-params ce transparent
  call-params async
  call-params async nr-stop-bits 1
  call-params async nr-data-bits 8
  call-params async parity none
 no shutdown
!
! GSMTAP configuration
!
gsmtap
 remote-host 172.20.0.1
 no local-host
 lchan sacch
 lchan lsacch
 lchan sacch/4
 lchan sacch/8
 lchan sacch/f
 lchan sacch/h
 lchan unknown
 lchan bcch
 lchan ccch
 lchan rach
 lchan agch
 lchan pch
 lchan sdcch
 lchan sdcch/4
 lchan sdcch/8
 lchan facch/f
 lchan facch/h
 lchan pacch
 lchan cbch
 lchan pdch
 lchan pttch
 lchan tch/f
 lchan tch/h
 category gprs dl-unknown
 category gprs dl-dummy
 category gprs dl-ctrl
 category gprs dl-data-gprs
 category gprs dl-data-egprs
 category gprs ul-unknown
 category gprs ul-dummy
 category gprs ul-ctrl
 category gprs ul-data-gprs
 category gprs ul-data-egprs
end

